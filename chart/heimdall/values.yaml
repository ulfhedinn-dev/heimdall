# Default values for the heimdall operator.

replicaCount: 1

image:
  repository: ghcr.io/ulfhedinn-dev/heimdall
  tag: ""              # defaults to Chart.appVersion when empty
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Add cloud-provider workload-identity annotations here. Examples:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/heimdall-scanner
  #   iam.gke.io/gcp-service-account: heimdall@my-project.iam.gserviceaccount.com
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Trivy holds the vulnerability DB and one image's package list in memory
# while scanning; 1Gi is enough for typical images.
resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 50m
    memory: 192Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Leader election: enable when running multiple replicas.
leaderElection:
  enabled: false

metrics:
  port: 8080
  service:
    # Creates a ClusterIP Service exposing the metrics port.
    enabled: true
  # Adds prometheus.io/scrape, port and path annotations to the pod, for
  # Prometheus setups using annotation-based pod discovery.
  podAnnotations: false
  serviceMonitor:
    # Creates a ServiceMonitor (requires the Prometheus Operator CRDs).
    enabled: false
    interval: 60s
    labels: {}
healthProbes:
  port: 8081

# ---- Heimdall operator-specific settings -----------------------------------

ecr:
  # Enables the ECR credential provider on image hostnames matching
  # `*.dkr.ecr.*.amazonaws.com`. Requires IRSA to be configured on the service
  # account above.
  enabled: false
  region: us-east-1

gcr:
  # Enables the Google (GCR / Artifact Registry) credential provider, which
  # uses Application Default Credentials / Workload Identity.
  enabled: true

slack:
  # Incoming webhook URL. Can be set directly or via existingSecret below.
  webhookUrl: ""
  # When set, read the webhook URL from an existing secret with key `url`.
  existingSecret: ""
  # Minimum severity that triggers an alert: LOW | MEDIUM | HIGH | CRITICAL
  minSeverity: HIGH

scan:
  # How frequently to rescan each unique image digest.
  intervalMinutes: 60
  # Upper bound for a single scan.
  timeoutMinutes: 10
  # Pause between consecutive scans. Scans always run one at a time; the
  # cooldown keeps CPU and network use low on small nodes.
  cooldownSeconds: 30
  # Inventory records reconciled in parallel (does not parallelize scans).
  concurrency: 1

trivy:
  cacheDir: /var/cache/heimdall/trivy
  offline: false       # skip DB updates (needs a pre-populated cache)
  # Persistent volume for the trivy cache. Set storageClass to "" to use the
  # cluster default. When persistence.enabled=false, an emptyDir is used.
  # The cache holds Trivy's vulnerability DB (~1.8 GB, refreshed daily) and,
  # once a Java image has been scanned, the Java DB (~1.6 GB).
  persistence:
    enabled: true
    size: 6Gi
    storageClass: ""

# Install the CRDs as part of the chart. Set to false to manage them out of band.
installCRDs: true
