name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1
      - name: Generated code and CRDs are up to date
        run: make verify-generated

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - run: helm lint chart/heimdall
      - run: helm template heimdall chart/heimdall > /tmp/rendered.yaml
      - run: helm template heimdall chart/heimdall --set metrics.serviceMonitor.enabled=true --set metrics.podAnnotations=true --set slack.existingSecret=heimdall-slack > /tmp/rendered-all.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - name: Run end-to-end test in kind
        run: ./hack/e2e.sh

  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test, helm, e2e]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - name: Check chart version matches tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart_version=$(yq '.version' chart/heimdall/Chart.yaml)
          app_version=$(yq '.appVersion' chart/heimdall/Chart.yaml)
          if [[ "$chart_version" != "$version" || "$app_version" != "$version" ]]; then
            echo "Chart.yaml version ($chart_version) / appVersion ($app_version) must equal tag version ($version)" >&2
            exit 1
          fi
      - name: Package and push Helm chart to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package chart/heimdall --destination dist
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/heimdall-${GITHUB_REF_NAME#v}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<NOTES
          Container image: \`ghcr.io/${{ github.repository }}:${version}\` (linux/amd64, linux/arm64)

          Helm chart: \`helm install heimdall oci://ghcr.io/${{ github.repository_owner }}/charts/heimdall --version ${version}\`
          NOTES
          gh release create "$GITHUB_REF_NAME" "dist/heimdall-${version}.tgz" \
            --title "Heimdall ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes \
            $([[ "$version" == *-* ]] && echo --prerelease)
