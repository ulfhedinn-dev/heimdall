name: ci

# Continuous delivery: every push runs the checks; a push to main that passes
# them is released as the next version (from Conventional Commits, see
# hack/next-version.sh): multi-arch image + Helm chart on GHCR, a vX.Y.Z tag
# and a GitHub release. The image and chart are also copied to the owner's Zot
# registry (registry.ulfhedinn.net), which is what highland pulls. Pushing a
# vX.Y.Z tag by hand (e.g. from a hotfix branch cut from an older tag)
# publishes that version the same way.
#
# Checks run on branch pushes rather than pull_request events, so a PR from a
# branch in this repo isn't tested twice; its status checks still show on the
# PR because they're attached to the commit.

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a release in progress on main or a tag.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=15m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1
      - name: Generated code and CRDs are up to date
        run: make verify-generated

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - run: helm lint chart/heimdall
      - run: helm template heimdall chart/heimdall > /tmp/rendered.yaml
      - run: helm template heimdall chart/heimdall --set metrics.serviceMonitor.enabled=true --set metrics.podAnnotations=true --set slack.existingSecret=heimdall-slack > /tmp/rendered-all.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - name: Run end-to-end test in kind
        run: ./hack/e2e.sh

  version:
    runs-on: ubuntu-latest
    needs: [lint, test, helm, e2e]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(./hack/next-version.sh)
          fi
          if [[ -z "$version" ]]; then
            echo "HEAD is already released; nothing to publish."
          else
            echo "Releasing $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(cut -d. -f1-2 <<<"$version")" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [version]
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.minor }}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [version, build-and-push]
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.2
      - name: Package and push Helm chart to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package chart/heimdall --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/heimdall-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Install regctl
        run: |
          curl -fsSL -o "$RUNNER_TEMP/regctl" \
            https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-amd64
          echo "3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc  $RUNNER_TEMP/regctl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The GHCR packages are private; highland pulls from the owner's Zot
      # registry instead. The heimdall-ci Zot user can only push to the
      # heimdall and charts/heimdall repositories.
      - name: Copy image and chart to Zot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOT_PUSH_PASSWORD: ${{ secrets.ZOT_PUSH_PASSWORD }}
          SRC: ghcr.io/${{ github.repository_owner }}
          DST: registry.ulfhedinn.net
          EXTRA_TAGS: ${{ needs.version.outputs.minor }} ${{ github.ref == 'refs/heads/main' && 'latest' || '' }}
        run: |
          if [[ -z "$ZOT_PUSH_PASSWORD" ]]; then
            echo "::error::The ZOT_PUSH_PASSWORD repository secret is not set."
            exit 1
          fi
          echo "$GITHUB_TOKEN" | regctl registry login ghcr.io --user "${{ github.actor }}" --pass-stdin
          echo "$ZOT_PUSH_PASSWORD" | regctl registry login "$DST" --user heimdall-ci --pass-stdin
          bash hack/mirror-to-zot.sh
      # Creates the vX.Y.Z tag on this commit when it doesn't exist yet. Tags
      # created with GITHUB_TOKEN don't trigger another workflow run.
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<NOTES
          Container image: \`ghcr.io/${{ github.repository }}:${VERSION}\` (linux/amd64, linux/arm64)

          Helm chart: \`helm install heimdall oci://ghcr.io/${{ github.repository_owner }}/charts/heimdall --version ${VERSION}\`
          NOTES
          gh release create "v${VERSION}" "dist/heimdall-${VERSION}.tgz" \
            --target "$GITHUB_SHA" \
            --title "Heimdall v${VERSION}" --notes-file notes.md --generate-notes \
            $([[ "$VERSION" == *-* ]] && echo --prerelease)
